name: Quality gates
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate workflow syntax with pinned actionlint
        run: |
          mkdir -p .qa-data/actionlint .qa-data/test-results
          cd .qa-data/actionlint
          curl --fail --silent --show-error --location --output actionlint_1.7.12_linux_amd64.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl --fail --silent --show-error --location --output checksums.txt https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          rg '  actionlint_1.7.12_linux_amd64.tar.gz$' checksums.txt | sha256sum --check
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          cd ../..
          .qa-data/actionlint/actionlint -shellcheck= .github/workflows/quality.yml .github/workflows/release.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=.qa-data/test-results/release.xml ops/tests/*.test.cjs
      - run: docker build --tag vuavuive-backend:ci backend
      - run: docker compose -p vuavuive-qa -f ops/compose.qa.yml up -d --wait
      - run: npm test -- --runInBand --silent --json --outputFile=../.qa-data/test-results/backend.json
        working-directory: backend
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27019/vuavuive_test?replicaSet=rs0&directConnection=true
      - run: node ops/restore-drill.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ml/VuaVuiVe_Recommender/requirements.txt
      - run: python -m unittest discover -s ml/VuaVuiVe_Recommender/tests -v
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run build:customer
        working-directory: frontend
      - run: npm run build:admin
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Package the verified customer and admin builds
        if: github.event_name == 'push'
        run: node ops/release.cjs package .qa-data/fullstack-release "$RELEASE_SHA"
        env:
          RELEASE_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: fullstack-release
          path: .qa-data/fullstack-release/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-quality-evidence
          path: |
            .qa-data/test-results/
            qa-portfolio/reports/artifacts/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      - run: docker compose -p vuavuive-qa -f ops/compose.qa.yml down
        if: always()
